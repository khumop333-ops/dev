version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: highveld_herbal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: highveld_herbal
      TZ: Africa/Johannesburg
    ports:
      - "5432:5432"
    volumes:
      - highveld_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d highveld_herbal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  highveld_pgdata:
